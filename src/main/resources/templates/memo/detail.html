<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">

    <section layout:fragment="contents" class="contents d-flex justify-content-center">
        <div id="memoContents" class="contents-box my-5" th:data-id="${memo.id}">
            <h2 class="text-center">메모 상세</h2>
            <input th:value="${memo.title}" value="대충 샘플 제목" id="titleInput" type="text" class="form-control mt-4" placeholder="제목을 입력하세요">
            <textarea th:text="${memo.contents}" id="contentsInput" class="form-control mt-3" rows="12" placeholder="내용을 입력하세요">대충 내용 샘플</textarea>
            <img th:if="${memo.imagePath != null && memo.imagePath != ''}" width="200px" height="200px" th:src="${memo.imagePath}">
            <div class="d-flex justify-content-between my-3 ">
                <button id="removeBtn" type="button" class="btn btn-danger">삭제</button>
                <div class="d-flex">
                    <div><a href="/memo/list" class="btn btn-secondary mr-2">목록으로</a></div>
                    <div><button id="saveBtn" type="button" class="btn btn-secondary">수정</button> </div>
                </div>
            </div>
        </div>
    </section>

    <script layout:fragment="script">

        $("#removeBtn").on("click", function() {
            let id = $("#memoContents").data("id");

            $.ajax({
                type:"delete"
                , url:"/memo/remove"
                , data:{"id":id}
                , success:function(response) {
                    if(response.result == "success") {
                        location.href = "/memo/list";
                    } else {
                        alert("글 삭제 실패!");
                    }
                }
                , error:function() {
                    alert("글 삭제 에러!");
                }
            });
        });

        $("#saveBtn").on("click", function() {
            let id = $("#memoContents").data("id");
            let title = $("#titleInput").val();
            let contents = $("#contentsInput").val();

            // console.log(id);
            // console.log(title);
            // console.log(contents);

            $.ajax({
                type:"put"
                , url:"/memo/modify"
                , data:{"id":id, "title":title, "contents":contents}
                , success:function(response) {
                    if(response.result == "success") {
                        location.reload();
                    } else {
                        alert("게시글 수정 실패!");
                    }
                }
                , error:function() {
                    alert("게시글 수정 에러!");
                }
            });
        });
    </script>
</html>
