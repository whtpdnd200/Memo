<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">

    <section layout:fragment="contents" class="contents d-flex justify-content-center">
        <div class="contents-box my-5">
            <h2 class="text-center">메모 작성</h2>
            <input id="titleInput" type="text" class="form-control mt-4" placeholder="제목을 입력하세요">
            <textarea id="contentsInput" class="form-control mt-3" rows="12" placeholder="내용을 입력하세요"></textarea>
            <input id="fileInput" type="file" class="mt-3">
            <div class="d-flex justify-content-between my-3 ">
                <div><a href="/memo/list" class="btn btn-secondary">목록으로</a></div>
                <div><button id="saveBtn" type="button" class="btn btn-secondary">저장</button> </div>
            </div>
        </div>
    </section>
    <script layout:fragment="script">
        $("#saveBtn").on("click", function() {
            let title = $("#titleInput").val();
            let contents = $("#contentsInput").val();
            let file = $("#fileInput")[0].files[0];

            if(title == "") {
                alert("제목을 입력하세요!");
                return;
            }

            if(contents == "") {
                alert("내용을 입력하세요!");
                return;
            }

            let formData = new FormData();

            formData.append("title", title);
            formData.append("contents", contents);
            formData.append("imageFile", file);


            $.ajax({
                type:"post"
                , url:"/memo/write-process"
                , data:formData
                , processData:false
                , contentType:false
                ,success:function(response) {
                    if(response.result == "success") {
                        location.href = "/memo/list";
                    } else {
                        alert("메모 작성 실패!");
                    }
                }
                , error:function() {
                    alert("메모 작성 에러!");
                }
            });
        });
    </script>
</html>
